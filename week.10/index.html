<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Pizza Data</title>
    
</head>
<body>
    <div class="container my-5">
        <h1 class="mb-4">Pizza Toppings</h1>
      
        <!-- Table -->
        <table class="table table-striped" id="toppingsTable">
          <thead class="table-dark">
            <tr>
              <th scope="col">Topping</th>
              <th scope="col">Type</th>
              <th scope="col">Spicy</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Pepperoni</td>
              <td>Meat</td>
              <td>Yes</td>
            </tr>
            <tr>
              <td>Mushrooms</td>
              <td>Vegetable</td>
              <td>No</td>
            </tr>
          </tbody>
        </table>
      
        <!-- Form -->
        <h2 class="mt-5">Add New Topping</h2>
        <form id="toppingForm" class="row g-3">
          <div class="col-md-4">
            <label for="toppingName" class="form-label">Topping Name</label>
            <input type="text" class="form-control" id="toppingName" required>
          </div>
          <div class="col-md-4">
            <label for="toppingType" class="form-label">Type</label>
            <select class="form-select" id="toppingType" required>
              <option value="">Choose...</option>
              <option value="Meat">Meat</option>
              <option value="Vegetable">Vegetable</option>
              <option value="Cheese">Cheese</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="toppingSpicy" class="form-label">Spicy</label>
            <select class="form-select" id="toppingSpicy" required>
              <option value="">Choose...</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Topping</button>
          </div>
        </form>
      </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
