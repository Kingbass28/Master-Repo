<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic-Tac-Toe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .cell {
      width: 100px;
      height: 100px;
      border: 1px solid #ccc;
      font-size: 2rem;
      text-align: center;
      vertical-align: middle;
      line-height: 100px;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      margin: 20px auto;
    }
    .alert-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body class="text-center p-5">

  <h1 id="turnHeading">Turn: X</h1>

  <div class="grid mb-3" id="gameGrid"></div>

  <button class="btn btn-danger" id="resetBtn">Restart Game</button>

  <div id="alertContainer" class="alert-overlay d-none">
    <div class="alert alert-info fs-3" role="alert" id="alertMessage"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
